; The CLI default is 128M. Loading the HTTP stack crosses that and the
; built-in server returns an empty 500.
memory_limit=512M

; artisan serve is the CLI SAPI, so opcache stays off unless this is set.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit_buffer_size=0

log_errors=On
error_log=/dev/stderr
display_errors=Off
